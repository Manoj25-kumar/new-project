<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Search -->
        <div class="search">
            <input type="text" id="searchBox" placeholder="Enter city name">
            <button id="searchButton">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

  

        <p id="error"></p>

        <!-- Weather -->
        <div class="weather">

            <p id="date">Today</p>

            <i id="weatherIcon" class="weather-icon fa-solid fa-cloud"></i>

            <h1 id="temperature">--°C</h1>

            <h2 id="city">City Name</h2>

            <p id="description">Weather condition</p>

            <p class="feels">
                Feels like <span id="feelsLike">--°C</span>
            </p>


            <!-- Important Weather Information -->
            <div class="weather-grid">

                <div class="info">
                    <i class="fa-solid fa-droplet"></i>
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-wind"></i>
                    <span>Wind Speed</span>
                    <strong id="wind">-- m/s</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-temperature-high"></i>
                    <span>Max Temp</span>
                    <strong id="maxTemp">--°C</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-temperature-low"></i>
                    <span>Min Temp</span>
                    <strong id="minTemp">--°C</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-cloud"></i>
                    <span>Clouds</span>
                    <strong id="clouds">--%</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-eye"></i>
                    <span>Visibility</span>
                    <strong id="visibility">-- km</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-compass"></i>
                    <span>Wind Direction</span>
                    <strong id="windDirection">--°</strong>
                </div>

                <div class="info">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Pressure</span>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>


            <!-- Sunrise / Sunset -->
            <div class="sun">

                <div>
                    <i class="fa-solid fa-sun"></i>

                    <section>
                        <span>Sunrise</span>
                        <strong id="sunrise">--:--</strong>
                    </section>
                </div>

                <div>
                    <i class="fa-solid fa-moon"></i>

                    <section>
                        <span>Sunset</span>
                        <strong id="sunset">--:--</strong>
                    </section>
                </div>

            </div>

        </div>

    </div>
  <script src="script.js"></script>
</body>
</html>
